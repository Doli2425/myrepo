version: 0.2

env:
  variables:
    REPOSITORY_URI: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/myweb   # ← 네 ECR 주소
    AWS_DEFAULT_REGION: ap-northeast-2                                         # ← 리전

phases:
  pre_build:
    commands:
      - echo "[INFO] Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo "[INFO] Build started on `date`"
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker push $REPOSITORY_URI:$IMAGE_TAG

post_build:
  commands:
      - echo "[{\"name\":\"myweb\",\"imageUri\":\"$REPOSITORY_URI:$IMAGE_TAG\"}]" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json

